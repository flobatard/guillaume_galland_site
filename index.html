<!doctype html>
<html lang="fr">
  <head>
    <!-- Ce fichier ne porte QUE l'invariant de route.
         Toutes les métadonnées variables (title, description, canonical,
         og:*, twitter:*, JSON-LD) sont émises par src/components/Seo.tsx.
         vite-react-ssg préfixe ses balises dans <head> sans dédoublonnage :
         toute balise dupliquée ici se retrouverait en double dans le HTML
         prérendu. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <!-- Les polices (GFS Didot, Montserrat) sont auto-hébergées via
         @fontsource (src/index.css) : aucune requête vers Google Fonts. -->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
