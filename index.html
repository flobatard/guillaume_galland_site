<!doctype html>
<html lang="fr">
  <head>
    <!-- Ce fichier ne porte QUE l'invariant de route.
         Toutes les métadonnées variables (title, description, canonical,
         og:*, twitter:*, JSON-LD) sont émises par src/components/Seo.tsx.
         vite-react-ssg préfixe ses balises dans <head> sans dédoublonnage :
         toute balise dupliquée ici se retrouverait en double dans le HTML
         prérendu. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
