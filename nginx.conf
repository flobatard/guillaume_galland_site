# Reproduit le comportement de vercel.json : cleanUrls, redirections,
# headers de sécurité et cache des assets
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirections relatives (préserve host/port derrière un reverse proxy)
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;

    location = / {
        return 301 /fr;
    }

    location = /mentions-legales {
        return 301 /fr/mentions-legales;
    }

    # Assets fingerprintés par Vite : cache long
    # (add_header dans un bloc location annule l'héritage, on répète les headers)
    location /assets/ {
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # cleanUrls : /fr → fr.html, /fr/mentions-legales → fr/mentions-legales.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
